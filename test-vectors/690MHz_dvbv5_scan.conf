# dvbv5-scan input: single known-good mux (690 MHz, UHF ch 48).
#   dvbv5-scan -a 0 690MHz_dvbv5_scan.conf
# Scan output is written in dvbv5 format (-o channels.conf) and will contain
# the real PLP/STREAM_ID, modulation and code rates as broadcast.
[690MHz]
	DELIVERY_SYSTEM = DVBT2
	FREQUENCY = 690000000
	BANDWIDTH_HZ = 8000000
	INVERSION = AUTO
	CODE_RATE_HP = AUTO
	CODE_RATE_LP = AUTO
	GUARD_INTERVAL = AUTO
	TRANSMISSION_MODE = AUTO
	HIERARCHY = AUTO
	MODULATION = QAM/AUTO
	STREAM_ID = 0