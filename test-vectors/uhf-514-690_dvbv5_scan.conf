# Full-band DVB-T2 scan for the H831: UHF 26-48 (514-690 MHz, 8 MHz raster).
# Use with: dvbv5-scan -a 0 uhf-514-690_dvbv5_scan.conf
# Muxes actually seen on the Pi: 546, 554, 578 and 690 MHz.

[UHF 26 - 514 MHz DVBT2]
	DELIVERY_SYSTEM = DVBT2
	FREQUENCY = 514000000
	BANDWIDTH_HZ = 8000000
	INVERSION = AUTO
	CODE_RATE_HP = AUTO
	CODE_RATE_LP = AUTO
	GUARD_INTERVAL = AUTO
	TRANSMISSION_MODE = AUTO
	HIERARCHY = AUTO
	MODULATION = QAM/AUTO

